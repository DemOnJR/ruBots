// Settings for the protocol-test server.
//
// PRECEDENCE. Both statements below are verified, and together they mean the
// winner DEPENDS ON WHEN YOU ASK:
//
//   * server.cfg is exec'd ONCE, at startup, by the engine
//     (rehlds/engine/sys_dll2.cpp:669, cvar `servercfgfile`).
//   * game.cfg is exec'd by ReGameDLL's InstallGameRules on EVERY map load
//     (regamedll/dlls/gamerules.cpp:136).
//
// At startup the first map loads (running game.cfg) and server.cfg is applied
// afterwards, so SERVER.CFG WINS. After any later map change only game.cfg
// runs, so GAME.CFG WINS. Observed directly: game.cfg said mp_roundtime 1, the
// file in the container said 1, and `rcon mp_roundtime` said 9.
//
// Rather than depend on that ordering, anything set in both files is kept
// IDENTICAL in both. If you change a value here, change it in game.cfg too.

hostname "OLDS protocol test server"
sv_lan 1
sv_region 255
rcon_password "rebots_local"

// Never change map. Also pinned in game.cfg, which is the copy that actually
// survives a map load.
mp_timelimit 0
mp_maxrounds 0
mp_winlimit 0
mp_fraglimit 0

// File-consistency enforcement.
//
// `sv_consistency` DOES NOT EXIST in ReHLDS or ReGameDLL -- the real cvar is
// `mp_consistency` (rehlds/engine/sv_user.cpp:60, default "1"). This file set
// the wrong name for weeks, so consistency was silently ON the whole time and
// SV_Spawn_f_internal (sv_main.cpp:1663) refused to spawn the bot with
// "You didn't send consistency response".
//
// Off here for iteration speed. The client implements the real response
// (crates/proto/src/consistency.rs) and is exercised against `mp_consistency 1`
// as a separate acceptance pass -- it must work on public servers, which all
// leave this at the default.
mp_consistency 0

sv_allowdownload 0
sv_allowupload 0

// Keep bots from being shuffled or blocked when joining a team.
mp_autoteambalance 0
mp_limitteams 0

// Short rounds. A bot that joins mid-round is in the game but DEAD until the
// next one starts, so the round length is the worst-case wait before it can
// act. Kept identical in game.cfg. 1 is the minimum ReGameDLL accepts.
mp_freezetime 1
mp_roundtime 1

// Generous timeout so a bot under debugging is not dropped mid-experiment.
sv_timeout 120

// Quality-of-life for testing.
mp_autokick 0
sv_voiceenable 0

// Rate limits. Defaults are sv_maxupdaterate 30 / sv_maxrate 0
// (sv_main.cpp:191). The client advertises cl_updaterate 100 and rate 100000,
// which SV_CheckUpdateRate/SV_CheckRate would otherwise clamp down.
sv_maxupdaterate 102
sv_minupdaterate 30
sv_maxrate 100000
sv_minrate 15000

// A full 5v5 of bots all originate from 127.0.0.1. The default of 5
// (sv_main.cpp:255) silently refuses the 6th with "Too many connect packets".
sv_rehlds_maxclients_from_single_ip 32

// Console logging: without this HLDS never reports connects, team joins or
// command execution, so a working bot and a broken one look identical.
// mp_logdetail 3 is what produces the "attacked ... (damage n)" lines the
// acceptance harness uses to prove the bot actually shot someone.
log on
sv_logbans 0
mp_logdetail 3
mp_logmessages 1

# ========================================================
#       REUNION CONFIGURATION — tuned by counter-strike-boost.com
# ========================================================
#
# WHAT WE CHANGED vs the file Reunion ships:
#   SteamIdHashSalt    was empty  -> generated, unique to THIS download
#   QueryFloodBanLevel was 400    -> 160
#   QueryFloodBanTime  was 10     -> 30
# Everything else is upstream's default. Each change is annotated below.

### AUTH CONTROL ###
# Client-ID types. All upstream defaults.
#  1 = real/generated STEAM_x:x:x, 3 = STEAM_ by IP, 5 = reject the client.
# The 5s matter: p.47/p.48 clients cannot produce a unique ID, so they are
# rejected rather than allowed to collide with somebody else's identity.
cid_Steam = 1
cid_SteamPending = 5
cid_HLTV = 5
cid_NoSteam47 = 5
cid_NoSteam48 = 5
cid_RevEmu = 1
cid_RevEmu2013 = 1
cid_SC2009 = 1
cid_OldRevEmu = 1
cid_SteamEmu = 1
cid_AVSMP = 1
cid_Setti = 3
cid_SXEI = 1

### AUTH SETTINGS ###
AuthVersion = 3

# >>> GENERATED PER DOWNLOAD — DO NOT COPY THIS TO ANOTHER SERVER <<<
# Salt for SteamID hashing. Upstream ships this EMPTY, and with AuthVersion 3
# an empty salt makes Reunion fail to start. It also prevents SteamID stealing:
# with a salt unique to your server, an ID harvested elsewhere cannot be
# replayed here, which is what makes "admin by SteamID" in users.ini safe.
# Changing it re-generates every non-Steam player's ID, including your admins.
SteamIdHashSalt = 41f2f5d5f42885f650858fe928022026a63076082ee6cfb4

SC2009_RevCompatMode = 1
EnableSXEIdGeneration = 0
EnableGenPrefix2 = 0
HLTVExcept_IP = 127.0.0.1
IPGen_Prefix1 = 0
IPGen_Prefix2 = 4
Native_Prefix1 = 0;
RevEmu_Prefix1 = 1;
RevEmu2013_Prefix1 = 1;
SC2009_Prefix1 = 1;
OldRevEmu_Prefix1 = 2;
SteamEmu_Prefix1 = 3;
AVSMP_Prefix1 = 4;
Setti_Prefix1 = 5;
SXEI_Prefix1 = 6;

### QUERY FLOOD PROTECTION ###
# Reunion has its own query limiter, separate from and stricter than the
# engine's max_queries_sec. This one can ban, not just drop.
ServerInfoAnswerType = 0
FixBuggedQuery = 1
EnableQueryLimiter = 1

# Upstream default is 400 queries/sec before banning, but upstream also states
# "Maximum measured legit level is 80/sec". 400 leaves a 5x gap a flood can sit
# inside. 160 is 2x the measured legit ceiling — still generous for real server
# browsers and monitors, but it reacts to an actual flood.
QueryFloodBanLevel = 160

# Ban duration in minutes (max 60). 10 minutes means a flooder simply returns
# six times an hour.
QueryFloodBanTime = 30

# Exempt your own monitoring hosts from the limiter, one IP per line:
[QueryLimiterExceptIP]

AllowSplitPackets = 0
IDClientsLimit = 1
LoggingMode = 0

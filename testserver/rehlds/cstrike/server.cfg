// =====================================================================
//  server.cfg — tuned by counter-strike-boost.com
//  Generated by the CSB Server Creator. Safe to edit; nothing regenerates
//  this file on your VPS.
//
//  HOW TO READ THIS FILE
//  Every line we deliberately moved off its default is annotated:
//
//      mp_freezetime 3        // stock 6 — why we changed it
//
//  "stock" is the value Counter-Strike uses when the cvar is never set, so
//  putting it back is always a one-line edit. Lines with no "stock" note are
//  set to the default already and are here for visibility, so you can see
//  the whole tuned surface in one place instead of guessing what we touched.
// =====================================================================

hostname "New CS 1.6 Server"
rcon_password ""
sv_password ""
sv_lan 0
sv_region 255

// --- networking -------------------------------------------------------
// 1000 fps engine tick with rates that let 100-tick clients actually use it.
// The min* values keep a player on a bad connection from dragging the server
// down while still letting them play.
sys_ticrate 1000        // stock 100 — the single biggest feel/registration win
sv_maxrate 100000       // stock 0 (uncapped). 100000 was UNANIMOUS across every
                        //   surveyed server that exposes it — see the survey
                        //   note at the bottom of this file.
sv_minrate 15000        // stock 0 — floor so nobody negotiates a useless rate.
                        //   15000 is the surveyed median.
sv_maxupdaterate 102    // stock 30
sv_minupdaterate 30     // stock 10
sv_maxcmdrate 102       // stock 0 (unset)
sv_mincmdrate 30        // stock 0 (unset)

// Lag compensation with a bounded rewind window: sv_maxunlag stops high-ping
// players from shooting half a second into the past.
sv_unlag 1
sv_maxunlag 0.5
sv_unlagsamples 1
sv_unlagpush 0

// --- movement ---------------------------------------------------------
// All stock. Listed so you can see nothing here was quietly changed —
// movement values are exactly where competitive play expects them.
sv_gravity 800
sv_accelerate 5
sv_airaccelerate 10
sv_friction 4
edgefriction 2
sv_stepsize 18
sv_stopspeed 75

// --- round flow -------------------------------------------------------
// Tuned for a public server: less standing around, more rounds per hour.
mp_freezetime 0         // stock 6 — 10 of the 15 surveyed servers run 0
mp_roundtime 2          // stock 5 — surveyed median is 2
mp_buytime 0.25         // stock 1.5 (minutes) — matches the surveyed majority
mp_c4timer 35           // stock 45 — matches the surveyed majority (10/14)
mp_startmoney 800       // stock, and the surveyed majority
mp_timelimit 30         // stock 0 (never changes map). Surveyed servers split
                        //   between 0 (single-map) and 20-30 (rotation).
mp_maxrounds 0
mp_winlimit 0
mp_friendlyfire 0       // stock, and 13 of 14 surveyed
mp_autoteambalance 0    // stock 1 — but ALL 14 surveyed servers disable it.
                        //   Auto-balance yanks players onto the losing team
                        //   mid-game, which is the single most complained-about
                        //   default on a public server.
mp_limitteams 2
mp_flashlight 1         // stock 0 — costs nothing, players expect it
mp_footsteps 1
// DELIBERATE DIVERGENCE from the survey: 11 of 14 run mp_forcecamera 0.
// We keep 2 because 0 lets a dead player spectate the enemy team and call
// their positions over voice — the cheapest form of cheating on a public
// server. Set it to 0 if you would rather match everyone else.
mp_forcecamera 2        // stock 0
mp_fadetoblack 0
mp_hostagepenalty 0     // stock 13 — disabled by 11 of 14 surveyed, and the
                        //   shipped rotation has no hostage maps anyway
mp_chattime 3           // stock 10 — surveyed median
mp_autokick 0           // stock 1 — stock kicks idle/TK players automatically,
                        //   which surprises admins running their own. 13 of 14
                        //   surveyed servers also disable it.
mp_allowmonsters 0
mp_consistency 1        // stock 1 — keep it on. Forces clients to match the
                        //   server's model/sprite files, which blocks the
                        //   classic transparent-model and hitbox-model cheats.
decalfrequency 30
pausable 0

// --- voice ------------------------------------------------------------
sv_voiceenable 1
sv_alltalk 0

// --- downloads / upload surface ---------------------------------------
// Point sv_downloadurl at a web server to give clients fast HTTP downloads
// instead of the slow in-game transfer.
sv_allowdownload 1
sv_downloadurl ""
sv_send_logos 1
sv_send_resources 1

// Uploads are the one path that lets a CLIENT push a file onto your server
// (custom spray logos). It is the smallest, least-useful feature with the
// largest attack surface in the engine, and 7 of the 9 surveyed servers that
// expose this cvar turn it off. Sprays stop working; that is the trade.
sv_allowupload 0        // stock 1

// --- query flood / DoS ------------------------------------------------
// The engine has a built-in per-IP rate limiter for connectionless packets
// (A2S_INFO / A2S_PLAYER / A2S_RULES — the "server browser" traffic that a
// flood abuses). Note the names have NO sv_ prefix; sv_max_queries_sec is not
// a real cvar and setting it does nothing.
//
// These are ReHLDS's shipped defaults, written out explicitly so they are
// visible and tunable rather than invisible. They are deliberately not
// tightened: legitimate monitors (server trackers, your own uptime checks)
// poll periodically, and an over-tight limit blocks them instead of attackers.
max_queries_sec 3.0            // per IP, averaged over the window below
max_queries_sec_global 30      // whole-server ceiling — this is the one that
                               //   actually blunts a distributed A2S flood
max_queries_window 60          // seconds

// Log blocked IPs so a flood is visible in the logs instead of just looking
// like "the server feels laggy".
sv_logblocks 1                 // stock 0

// The pre-Steam query protocol. Off by default and it must stay off: it is the
// classic UDP amplification/reflection vector, where a spoofed small query is
// answered with a much larger packet aimed at the victim.
sv_enableoldqueries 0

// IMPORTANT: none of the above stops a real volumetric DDoS. The engine can
// only drop packets it has already received, so a flood large enough to fill
// your uplink still hurts. Serious protection has to happen upstream of the
// game server — at your host's DDoS filtering or in iptables. Treat these as
// abuse control, not as DDoS protection.

// --- logging ----------------------------------------------------------
// Logging off by default means no evidence when something goes wrong.
log on                  // stock off
sv_logfile 1            // stock 0
sv_log_onefile 0
sv_logbans 1            // stock 0
sv_logecho 0            // stock 1 — keeps the live console readable
mp_logdetail 3          // stock 0 — logs damage/kills, what ban appeals need
mp_logmessages 1

// --- rcon hardening ---------------------------------------------------
// Three bad rcon passwords inside 30s earns a 60 minute ban. At stock values
// an attacker gets effectively unlimited attempts, which is how CS 1.6
// servers get their rcon brute-forced.
sv_rcon_banpenalty 60      // stock 0 (no ban at all)
sv_rcon_maxfailures 3      // stock 10
sv_rcon_minfailures 3      // stock 5
sv_rcon_minfailuretime 30  // stock 30
sv_filterban 1

exec listip.cfg
exec banned.cfg

// =====================================================================
//  WHERE THE "SURVEYED" NUMBERS COME FROM
// =====================================================================
//  Values above marked "surveyed" are not opinion. On 2026-07-31 we harvested
//  ~1000 public CS 1.6 servers from independent trackers (gametracker.com,
//  game-state.com), queried them directly over UDP, kept the 487 that answered,
//  filtered to genuine classic servers (stock map, no zombie/surf/deathrun/DM
//  mod in the name, real players), and read their live cvars via A2S_RULES.
//  We then took the top 15 by population, ONE PER /24 — several of the biggest
//  "servers" are one operator on consecutive IPs, and without that dedupe a
//  single host's config would masquerade as consensus.
//
//  Deliberately NOT sourced from counter-strike-boost.com's own listings.
//
//  Caveat worth knowing: A2S_RULES only exposes cvars flagged FCVAR_SERVER,
//  and the query-limiter cvars are additionally FCVAR_PROTECTED — so no survey
//  can reveal what anyone uses for anti-flood, rcon or the rehlds_* settings.
//  Those values come from ReHLDS's own source instead, which is why they are
//  set to documented defaults rather than to guesses about what "the best
//  servers" run.
// =====================================================================

// --- ReHLDS -----------------------------------------------------------
// These cvars only exist because this build includes ReHLDS. Defaults below
// were read out of ReHLDS'' own source (rehlds_security.cpp, ipratelimit.cpp,
// sv_main.cpp), not from memory.

sv_rehlds_hull_centering 1                  // stock 0 — fixes hitbox/hull
                                            //   offset, the classic "shot went
                                            //   through him" complaint

// Movement-command flood protection. These are ReHLDS's own defaults and are
// deliberately NOT tightened: a move command is sent per client frame, so a
// player at high FPS legitimately produces a lot of them. Lowering these is how
// you end up dropping your own regulars for "flooding".
sv_rehlds_movecmdrate_max_avg 1800
sv_rehlds_movecmdrate_max_burst 5500

// String-command flood protection (chat, name changes, console commands).
// This is the one clients can actually abuse to stall a server, and 250/500 is
// the shipped default.
sv_rehlds_stringcmdrate_max_avg 250
sv_rehlds_stringcmdrate_max_burst 500

// Trims what the server rebroadcasts about each player to the fields the game
// actually needs. Stock is empty = send every userinfo key a client sets, which
// leaks client settings and wastes bandwidth every time someone connects.
sv_rehlds_userinfo_transmitted_fields "\name\model\topcolor\bottomcolor\*sid\*hltv\_vgui_menus"

sv_rehlds_maxclients_from_single_ip 5       // ReHLDS default. Connection-flood
                                            //   protection. Raise it only if you
                                            //   genuinely have several players
                                            //   behind one address.

// Oversized sprays are a bandwidth and abuse vector — a client uploading a
// huge custom image to every other player on connect.
sv_rehlds_allow_large_sprays 0              // stock 1

sv_use_entity_file 0
sv_rcon_condebug 0                          // stock 1 — stops failed rcon
                                            //   attempts printing the attempted
                                            //   password into your console

// --- ReGameDLL --------------------------------------------------------
// Intentionally EMPTY of settings.
//
// ReGameDLL execs cstrike/game.cfg on every map load, while this file
// (server.cfg) is exec'd only once at startup — so anything ReGameDLL-related
// set here is overwritten at the first map change and every one after it.
// Setting it in two places just guarantees the two disagree.
//
// All ReGameDLL cvars therefore live in cstrike/game.cfg. Edit them there.

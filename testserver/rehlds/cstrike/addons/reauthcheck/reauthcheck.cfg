# ========================================================
# 		ReAuthCheck Configuration
# ========================================================


# Logging Level
# Numeric Value (0 | 3)
# 0 - Disable, 1 - Detection, 2 - Debug, 3 - Full Debug.
LogMode = 2

# Enable Detection Method for Invalid Players #1
# Numeric Value (0 | 1)
CheckMethod1 = 1

# Enable Detection Method for Invalid Players #2
# Numeric Value (0 | 1)
CheckMethod2 = 1

# Enable Detection Method for Invalid Players #3
# Numeric Value (0 | 1)
CheckMethod3 = 1

# Enable Detection Method for Invalid Players #4
# Numeric Value (0 | 1)
CheckMethod4 = 1

# Enable Detection Method for Invalid Players #5
# Numeric Value (0 | 1)
CheckMethod5 = 1

# Enable Detection Method for Invalid Players #6
# Numeric Value (0 | 1)
CheckMethod6 = 1

# Enable Detection Method for Invalid Players #7
# Numeric Value (0 | 1)
CheckMethod7 = 1

# Enable Detection Method for Invalid Players #8
# Numeric Value (0 | 1)
CheckMethod8 = 1

# Enable Detection Method for Invalid Players #9
# Numeric Value (0 | 1)
CheckMethod9 = 1

# Enable Detection Method for Invalid Players #10
# Numeric Value (0 | 1)
CheckMethod10 = 1

# Enable Detection of XFake Players
# Numeric Value (0 | 1)
CheckXFake = 1

# Enable Detection of HLProxy
# Numeric Value (0 | 1)
CheckHLProxy = 1

# Enable Limit for Players by IP Address
# Numeric Value (0 | 1)
CheckMaxIp = 0

# How Many Players with the Same IP Can Authenticate on the Server
# Numeric Value (1 | 31)
MaxIpNum = 32

# Enable Limit for Players by Number of Disconnects
# Numeric Value (0 | 1)
CheckMaxDrop = 1

# Maximum Number of Disconnects For Punishment
# Numeric Value (2 | 50)
MaxDropNum = 7

# The Time Period for Counting Warnings for "CheckMaxDrop"
# Float Value (2.0 | 300.0)
MaxDropTime = 15.0

# Enable Tracking of Player Connection State
# Numeric Value (0 | 1)
StateTimeoutConnect = 1

# Time to Detect Authorization Idle State Stage 1 (Player Connection Start)
# Float Value (5.0 | 120.0)
IdleTime1 = 15.0

# Time to Detect Authorization Idle State Stage 2 (Waiting for Command from Player #1)
# Float Value (7.0 | 120.0)
IdleTime2 = 14.0

# Time to Detect Authorization Idle State Stage 3 (Waiting for Command from Player #2)
# Float Value (7.0 | 120.0)
IdleTime3 = 10.0

# Time to Detect Authorization Idle State Stage 4 (Waiting for Response from Player #3)
# Float Value (7.0 | 120.0)
IdleTime4 = 10.0

# Time to Detect Authorization Idle State Stage 5 (Resource Check)
# Float Value (10.0 | 180.0)
IdleTime5 = 70.0

# Time to Detect Authorization Idle State Stage 6 (File Download)
# Float Value (60.0 | 1800.0)
IdleTime6 = 900.0

# Time to Detect Authorization Idle State Stage 7 (Player Validation)
# Float Value (7.0 | 120.0)
IdleTime7 = 8.0

# Time to Detect Authorization Idle State Stage 8 (Player Authenticated)
# Float Value (7.0 | 120.0)
IdleTime8 = 10.0

# Time to Detect Authorization Idle State Stage 9 (Full Authorization)
# Float Value (7.0 | 120.0)
IdleTime9 = 20.0

# Additional Punishment String for Detection, Which Will Be Executed in the Server Console
# For Methods "#1, #2, #5, #6", "CheckXFake"
# String Value "Maximum length up to 96 characters"
PunishStringXFake = addip 1440.0 [ip]

# Additional Punishment String for Detection, Which Will Be Executed in the Server Console
# For Method "CheckHLProxy"
# String Value "Maximum length up to 96 characters"
PunishStringHLProxy = addip 1440.0 [ip]

# Additional Punishment String for Detection, Which Will Be Executed in the Server Console
# For Method "CheckMaxIp"
# String Value "Maximum length up to 96 characters"
PunishStringMaxIP = addip 180.0 [ip]

# Additional Punishment String for Detection, Which Will Be Executed in the Server Console
# For Method "CheckMaxDrop"
# String Value "Maximum length up to 96 characters"
PunishStringMaxDrop = addip 60.0 [ip]

#
# Note
#
# Default Punishment for All Methods is Kick
# To Disable the Additional String, You Must Clear the Value
#
# String Formatting for Additional Punishment
# [name] - Player Name
# [ip] - Player IP Address
# [userid] - Player UserID
# [steamid] - Player SteamID
#

#
# List of IP Addresses to Ignore the "CheckMaxIp" and "CheckMaxDrop" Settings
# To Disable the Line use ";"
#

[List White IP]
;127.0.0.1

# The Docker bridge gateway: every bot on this box reaches the server
# through it, and so does a player connecting to 127.0.0.1. Thirty bots
# leaving at the end of a run is thirty disconnects in one second, far past
# MaxDropNum 7 in MaxDropTime 15, and PunishStringMaxDrop is a 60-minute
# addip -- which lands on the human sharing the address.
#
# This only exempts CheckMaxIp and CheckMaxDrop, which are policy limits.
# Every authenticity check (CheckMethod1-10, CheckXFake, CheckHLProxy) still
# applies to these clients in full.
172.18.0.1
127.0.0.1

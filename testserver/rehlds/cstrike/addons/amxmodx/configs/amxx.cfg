// AMX Mod X — tuned by counter-strike-boost.com
//
// Same keys as the amxx.cfg AMX Mod X ships. Lines we moved off the stock
// value are annotated "// stock <value>", so reverting any of them is a
// one-line edit.
echo Executing AMX Mod X Configuration File

amx_default_access "z"
amx_password_field "_pw"
amx_mode 1
amx_show_activity 2

// amx_scrollmsg / amx_imessage / amx_freq_imessage are DELIBERATELY ABSENT.
//
// Those cvars are registered by scrollmsg.amxx and imessage.amxx, which we
// disable in plugins.ini — they only ever displayed the stock "This server is
// using AMX Mod X" advertising. Leaving the cvars here without the plugins
// would print "unknown command" on every boot.
//
// If you re-enable those two plugins in plugins.ini, add back:
//   amx_scrollmsg "Welcome to %hostname%" 600
//   amx_imessage  "Welcome to %hostname%" "000255100"
//   amx_freq_imessage 180

amx_plmenu_bantimes 0 5 10 15 30 45 60
amx_tempban_maxtime 4320
amx_plmenu_slapdmg 0 1 5

amx_flood_time 1.0            // stock 0.75 — 0.75s still lets a spammer through

amx_reservation 0
amx_hideslots 0

amx_time_display "ab 1200" "ab 600" "ab 300" "ab 180" "ab 60" "bcde 11"
amx_time_voice 1

// Votes: a real majority to kick or ban, and a long enough gap that vote
// spam stops being a griefing tool.
amx_vote_delay 60             // stock 10
amx_vote_time 10
amx_vote_answers 1
amx_votekick_ratio 0.50       // stock 0.40
amx_voteban_ratio 0.50        // stock 0.40
amx_votemap_ratio 0.40
amx_vote_ratio 0.02
amx_extendmap_max 90
amx_extendmap_step 15

amx_language "en"
amx_client_languages 1
amx_language_display_msg 1
amx_help_display_msg 1
amx_help_display_msg_time 15
amx_help_amount_per_page 10

amx_debug 1
amx_mldebug ""
amx_perflog_ms 1.0

; Maps configuration file — counter-strike-boost.com
; File location: $moddir/addons/amxmodx/configs/maps.ini
; Used by the Maps Menu plugin for votes and nominations.
;
; Upstream ships this file empty, which makes the maps menu fall back to
; mapcycle.txt. We list the maps explicitly instead so the vote menu and the
; rotation cannot drift apart.
;
; ACTIVE = the five maps a classic public server actually fills on. A vote
; list full of maps nobody wants is how servers empty out at map change.
;
; To enable any map below, delete the ";" in front of it — and add it to
; mapcycle.txt too, or it will be votable but never in the rotation.

de_dust2
de_inferno
de_nuke
de_train

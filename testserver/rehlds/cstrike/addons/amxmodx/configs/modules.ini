; AMX Mod X modules — counter-strike-boost.com
;
; Everything here is COMMENTED OUT on purpose, exactly as upstream ships it.
; AMX Mod X auto-detects the modules a plugin needs and loads them itself.
;
; We used to enable them explicitly. Do not go back to that: AMX Mod X loads
; its modules THROUGH Metamod, so a module named here is asked for a second
; time if anything else already loaded it, and Metamod answers on every boot
; with
;
;   [META] ERROR: dll: Not loading plugin 'Fun'; already loaded (status=running)
;   [META] ERROR: dll: Failed to load plugin 'fun_amxx_i386.so'
;
; That is cosmetic — the module IS loaded and works — but it is seven scary
; ERROR lines in a fresh server's console, and the usual way people "fix" it
; is by deleting things that were fine. Auto-detection has no such failure
; mode, which is why upstream defaults to it.
;
; To force a module on anyway, remove the ";" in front of its name.

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; SQL modules — left OFF on purpose.              ;;
;; Nothing here needs a database, and sql.cfg ships ;;
;; with blank credentials (we removed the stock     ;;
;; root/no-password default). Enable one only when  ;;
;; you actually run a SQL-backed plugin, and fill   ;;
;; in sql.cfg first.                                ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;mysql
;sqlite

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Put third party modules below here.              ;;
;; Just the name — no _amxx and no file extension.  ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;



;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Base modules — all present in this build, all    ;;
;; auto-loaded on demand. Listed for reference.     ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;fun
;engine
;fakemeta
;geoip
;sockets
;regex
;nvault
;hamsandwich

; json ships with AMX Mod X too but is not listed by upstream in this file.

; geoip note: the base package also ships
; addons/amxmodx/data/GeoLite2-Country.mmdb, so geoip works the moment a plugin
; asks for it. If you ever delete that database, geoip will fail to load.

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Counter-Strike modules — present because this     ;;
;; build includes the AMX Mod X Counter-Strike pack. ;;
;; cstrike = CS natives, csx = stats (statsx, rank). ;;
;; Commented out like the rest: statsx.amxx and      ;;
;; friends declare them, so AMXX loads them itself.  ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;cstrike
;csx

; AMX Mod X plugins — counter-strike-boost.com
;
; Disabled below (each line says why). Remove the ";" to turn one back on.

; Admin Base - Always one has to be activated
admin.amxx		; admin base (required for any admin-related)
;admin_sql.amxx		; admin base - SQL version (comment admin.amxx)

; Basic
admincmd.amxx		; basic admin console commands
adminhelp.amxx		; help command for admin console commands
adminslots.amxx		; slot reservation
multilingual.amxx	; Multi-Lingual management

; Menus
menufront.amxx		; front-end for admin menus
cmdmenu.amxx		; command menu (speech, settings)
plmenu.amxx		; players menu (kick, ban, client cmds.)
;telemenu.amxx		; teleport menu (upstream ships this disabled)
mapsmenu.amxx		; maps menu (vote, changelevel)
pluginmenu.amxx		; Menus for commands/cvars organized by plugin

; Chat / Messages
adminchat.amxx		; console chat commands
antiflood.amxx		; prevent clients from chat-flooding the server — KEEP,
			;   this is protection, not decoration

; DISABLED by counter-strike-boost.com — stock advertising banners. These only
; ever displayed "This server is using AMX Mod X". Turning them back on also
; means restoring amx_scrollmsg / amx_imessage / amx_freq_imessage in amxx.cfg,
; which we removed because those cvars do not exist without these plugins.
;scrollmsg.amxx		; displays a scrolling message
;imessage.amxx		; displays information messages

adminvote.amxx		; vote commands

; Map related
nextmap.amxx		; displays next map in mapcycle
mapchooser.amxx		; allows to vote for next map
timeleft.amxx		; displays time left on map

; Configuration
; DISABLED by counter-strike-boost.com — SECURITY.
; pausecfg provides amx_pause / amx_unpause: anyone with the ADMIN_CFG flag can
; switch off other running plugins, including your anticheat, ban manager or
; logging. An admin who should only be able to kick can use it to silence the
; plugin that would have recorded what they did next. Enable only if you have a
; concrete need and trust everyone holding that flag.
;pausecfg.amxx		; allows to pause and unpause some plugins

statscfg.amxx		; allows to manage stats plugins via menu and commands

; Counter-Strike — present because this build includes the CS module pack.
statsx.amxx		; stats on death or round end (CSX Module required!)
;restmenu.amxx		; restrict weapons menu (upstream ships this disabled)
;miscstats.amxx		; event announcement spam (upstream ships this disabled)
;stats_logging.amxx	; weapon stats logging (upstream ships this disabled)



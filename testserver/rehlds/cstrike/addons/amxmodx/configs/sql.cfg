// SQL configuration file — hardened by counter-strike-boost.com
// File location: $moddir/addons/amxmodx/configs/sql.cfg
//
// ---------------------------------------------------------------------------
// WHAT WE CHANGED
// ---------------------------------------------------------------------------
// AMX Mod X ships this file with amx_sql_user "root" and an empty password.
// Any plugin using the default handle would then try to log into MySQL as root
// with no password — which is either a broken connection or, on a badly
// configured database, a complete compromise.
//
// We blanked the credentials. Fill them in ONLY if you actually use a
// SQL-backed plugin, and use a dedicated least-privilege database user —
// never root.
// ---------------------------------------------------------------------------

// *NOTE* Linux users may encounter problems if they specify "localhost"
// instead of "127.0.0.1". We recommend using your server IP address.

// *NOTE* amx_sql_type specifies the DEFAULT database type which admin.sma
// will use.

amx_sql_host    "127.0.0.1"
amx_sql_user    ""
amx_sql_pass    ""
amx_sql_db      "amx"
amx_sql_table   "admins"
amx_sql_type    "mysql"
amx_sql_timeout "60"

// ReGameDLL configuration — tuned by counter-strike-boost.com
//
// IMPORTANT: this file is exec'd on EVERY map load, while server.cfg is exec'd
// only once at startup. Anything set here therefore OVERRIDES server.cfg. If a
// value you set in server.cfg keeps reverting after a map change, it is because
// it is also set here — change it here instead.
echo Executing ReGameDLL Configuration File

// --- kept in sync with server.cfg -------------------------------------
mp_autoteambalance "0"        // stock 1. All 14 surveyed classic servers
                              //   disable it. Stock game.cfg resets this to 1
                              //   on every map, which is why it is repeated here.
mp_timelimit "30"             // stock game.cfg ships 20; matches our server.cfg
mp_buytime "0.25"             // stock 1.5 (minutes)

// --- item / weapon behaviour ------------------------------------------
mp_item_staytime "20"         // stock 300 — 5 minutes of dropped weapons
                              //   littering the map is a lot on a busy pub
mp_weapondrop "1"             // stock
mp_ammodrop "1"               // stock
mp_nadedrops "0"              // stock
mp_free_armor "0"             // stock
mp_t_give_player_knife "1"    // stock. NOTE: mp_give_player_knife is NOT a real
mp_ct_give_player_knife "1"   //   cvar — the per-team names are the real ones.

// --- round / scenario --------------------------------------------------
mp_round_infinite "0"         // stock
mp_roundover "0"              // stock
mp_round_restart_delay "5"    // stock
mp_kill_filled_spawn "1"      // stock — prevents players spawning inside each
                              //   other. Disable only if you run semiclip.
mp_respawn_immunitytime "0"   // stock
mp_legacy_bombtarget_touch "0"// stock 1 — the new, stricter bombsite check
mp_hostage_hurtable "1"       // stock. NOTE: mp_hostagehurtable (no underscore)
                              //   is NOT a real cvar.
mp_hostages_rescued_ratio "1.0"   // stock
mp_buy_anywhere "0"           // stock
mp_auto_reload_weapons "0"    // stock
mp_refill_bpammo_weapons "0"  // stock
mp_infinite_ammo "0"          // stock
mp_infinite_grenades "0"      // stock
mp_maxmoney "16000"           // stock
mp_max_teamkills "3"          // stock
mp_freezetime_duck "1"        // stock
mp_freezetime_jump "1"        // stock

// --- movement / feel ---------------------------------------------------
// All stock: bunnyhop assists stay OFF, which is what "classic" means.
sv_autobunnyhopping "0"
sv_enablebunnyhopping "0"
mp_jump_height "45"
mp_falldamage "1"

// --- chat / comms ------------------------------------------------------
sv_alltalk "0"                // stock — dead players cannot talk to the living
sv_allchat "0"                // stock — no cross-team text chat
mp_radio_timeout "1.5"        // stock — anti radio-spam
mp_radio_maxinround "60"      // stock

// --- SECURITY ----------------------------------------------------------
// Lets a MAP execute server console commands. Upstream flags it as
// "Potentially dangerous for untrusted maps" — a downloaded custom map could
// run rcon-level commands on your server. Stock is already 0; pinned here so
// enabling it has to be a deliberate act.
mp_allow_point_servercommand "0"

// Dead players revealing enemy positions is the cheapest cheat on a public
// server. mp_forcecamera in server.cfg is the main control; this hides the
// enemy defuse-kit hint from dead players for the same reason.
mp_scoreboard_showdefkit "1"  // stock
